    "apscheduler>=3.11.3",
    "edge-tts>=7.3.1",
    "elevenlabs>=2.74.1",
    "google-genai>=2.33.0",
    "greenlet>=3.5.6",
    "imageio-ffmpeg>=0.6.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.4",
    "pytz>=2026.5",
    "sqlalchemy>=2.1.6",
    "telethon>=1.45.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
